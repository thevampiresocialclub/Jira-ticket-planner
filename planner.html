<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner</title>
<style>
  :root {
    --peacock: #194B6A;
    --bondi: #0080A3;
    --plum: #492049;
    --ice: #DFE4F0;
    --tan: #F1E4D2;
    --crimson: #AC1A34;

    --radius: 6px;
    --hairline: 1px;
    --pad-1: 4px;
    --pad-2: 8px;
    --pad-3: 12px;
    --pad-4: 16px;
    --transition: 150ms cubic-bezier(0.34, 1.56, 0.64, 1);

    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, "Cascadia Code", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  :root[data-theme="light"] {
    --bg: var(--ice);
    --surface: #FFFFFF;
    --surface-warm: var(--tan);
    --surface-muted: #F5F7FB;
    --text: var(--peacock);
    --text-soft: rgba(25, 75, 106, 0.65);
    --text-faint: rgba(25, 75, 106, 0.4);
    --border: rgba(25, 75, 106, 0.15);
    --border-strong: rgba(25, 75, 106, 0.3);
    --accent: var(--bondi);
    --accent-text: #FFFFFF;
    --special: var(--plum);
    --alert: var(--crimson);
    --shadow-sm: 0 1px 2px rgba(25, 75, 106, 0.06);
    --shadow-md: 0 4px 12px rgba(25, 75, 106, 0.12);
  }

  :root[data-theme="dark"] {
    --bg: #0E1A24;
    --surface: #172534;
    --surface-warm: rgba(241, 228, 210, 0.06);
    --surface-muted: #111E2B;
    --text: var(--ice);
    --text-soft: rgba(223, 228, 240, 0.65);
    --text-faint: rgba(223, 228, 240, 0.4);
    --border: rgba(223, 228, 240, 0.12);
    --border-strong: rgba(223, 228, 240, 0.25);
    --accent: var(--bondi);
    --accent-text: #FFFFFF;
    --special: #6E3A6E;
    --alert: var(--crimson);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  .mono { font-family: var(--font-mono); }

  /* HEADER */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: var(--pad-3);
    padding: var(--pad-2) var(--pad-3);
    background: var(--surface);
    border-bottom: var(--hairline) solid var(--border);
    box-shadow: var(--shadow-sm);
  }

  .brand {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.01em;
    color: var(--text);
    margin-right: var(--pad-2);
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: var(--pad-1);
    flex: 1;
  }

  .range-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-soft);
    padding: 0 var(--pad-2);
    white-space: nowrap;
  }

  .toolbar .spacer { flex: 1; }

  button {
    font-family: var(--font-sans);
    font-size: 12px;
    background: transparent;
    color: var(--text);
    border: var(--hairline) solid var(--border);
    border-radius: var(--radius);
    padding: 5px 10px;
    cursor: pointer;
    transition: background var(--transition), border-color var(--transition), color var(--transition);
    line-height: 1.2;
  }
  button:hover {
    background: var(--surface-muted);
    border-color: var(--border-strong);
  }
  button.primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  button.primary:hover {
    filter: brightness(1.08);
  }
  button.linked {
    border-color: var(--accent);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 11px;
  }
  button.linked.warn {
    border-color: var(--alert);
    color: var(--alert);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  button:disabled:hover {
    background: transparent;
    border-color: var(--border);
  }
  button.icon {
    padding: 4px 6px;
    border: none;
    background: transparent;
    color: var(--text-soft);
    border-radius: 4px;
  }
  button.icon:hover { color: var(--text); background: var(--surface-muted); }

  /* MAIN LAYOUT */
  main {
    flex: 1 1 auto;
    display: flex;
    overflow: hidden;
    min-height: 0;
  }

  .weeks {
    flex: 1 1 auto;
    overflow: auto;
    padding: var(--pad-2);
    display: grid;
    grid-template-rows: repeat(2, 1fr);
    gap: var(--pad-2);
    min-width: 0;
  }

  .week {
    display: grid;
    grid-template-columns: repeat(5, 1fr) 0.9fr;
    grid-template-rows: 1fr 1fr;
    gap: var(--pad-1);
    min-height: 0;
  }
  .week .day:nth-child(-n+5) { grid-row: 1 / span 2; }
  .week .day:nth-child(6) { grid-column: 6; grid-row: 1; }
  .week .day:nth-child(7) { grid-column: 6; grid-row: 2; }

  .day {
    background: var(--surface);
    border: var(--hairline) solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
    transition: border-color var(--transition), background var(--transition);
  }
  .day.today { border-color: var(--accent); border-width: 2px; }
  .day.weekend { background: var(--surface-muted); }
  .day.overflow { border-top: 3px solid var(--alert); }
  .day.drag-over {
    background: var(--surface-warm);
    border-color: var(--special);
  }

  .day-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
    padding: 4px 6px;
    border-bottom: var(--hairline) solid var(--border);
    background: var(--surface-muted);
  }
  .day-name {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-soft);
    font-weight: 500;
  }
  .day-date {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text);
    font-weight: 500;
  }
  .day-hours {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
    margin-left: auto;
    padding-left: 4px;
  }
  .day.overflow .day-hours { color: var(--alert); font-weight: 600; }

  .day-blocks {
    flex: 1;
    overflow-y: auto;
    padding: 3px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  /* BACKLOG */
  .backlog {
    flex: 0 0 280px;
    background: var(--surface-warm);
    border-left: var(--hairline) solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .backlog-head {
    display: flex;
    border-bottom: var(--hairline) solid var(--border);
    background: var(--surface);
  }
  .tabs {
    display: flex;
    width: 100%;
  }
  .tab {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 9px 10px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--text-faint);
    cursor: pointer;
    font-family: var(--font-sans);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 0;
    transition: color var(--transition), border-color var(--transition);
  }
  .tab:hover {
    color: var(--text-soft);
    background: var(--surface-muted);
  }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .tab-count {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-faint);
    font-weight: 600;
    letter-spacing: 0;
    background: var(--surface-muted);
    padding: 1px 5px;
    border-radius: 8px;
    min-width: 16px;
    text-align: center;
  }
  .tab.active .tab-count {
    color: var(--accent);
    background: rgba(0, 128, 163, 0.12);
  }

  .tab-panel {
    display: none;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .tab-panel.active {
    display: flex;
  }

  .backlog-list {
    flex: 1;
    overflow-y: auto;
    padding: var(--pad-2);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .backlog-list.drag-over {
    background: rgba(73, 32, 73, 0.08);
  }
  .backlog-empty {
    text-align: center;
    color: var(--text-faint);
    font-size: 11px;
    padding: var(--pad-4);
    font-style: italic;
  }

  /* SEARCH */
  .search-bar {
    padding: var(--pad-2);
    border-bottom: var(--hairline) solid var(--border);
    background: var(--surface);
    position: relative;
  }
  .search-bar input {
    width: 100%;
    font-family: var(--font-sans);
    font-size: 12px;
    background: var(--surface-muted);
    border: var(--hairline) solid var(--border);
    border-radius: var(--radius);
    padding: 6px 26px 6px 10px;
    color: var(--text);
    box-sizing: border-box;
  }
  .search-bar input::placeholder { color: var(--text-faint); }
  .search-bar input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
  }
  .search-clear {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
    padding: 2px 6px;
    font-size: 14px;
    line-height: 1;
    border-radius: 3px;
    display: none;
  }
  .search-clear:hover { color: var(--text); background: var(--surface-muted); }
  .search-clear.show { display: block; }

  .search-results {
    flex: 1;
    overflow-y: auto;
    padding: var(--pad-2);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .search-empty {
    text-align: center;
    color: var(--text-faint);
    font-size: 11px;
    padding: var(--pad-4);
    font-style: italic;
  }
  .search-count {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
    padding: 0 var(--pad-2) 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* SEARCH RESULT BLOCK (read-only spans instead of inputs) */
  .block.search-result { cursor: default; }
  .block-name-display {
    font-family: var(--font-sans);
    font-size: 12px;
    color: #FFFFFF;
    padding: 1px 3px;
    flex: 1;
    min-width: 0;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .block-name-display.empty {
    color: rgba(255, 255, 255, 0.55);
    font-style: italic;
    font-weight: 400;
  }
  .block-hours-display {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text);
    font-weight: 700;
    width: 42px;
    text-align: right;
    padding: 1px 4px;
    flex-shrink: 0;
  }
  .block-note-display {
    font-family: var(--font-sans);
    font-size: 11px;
    color: var(--text-soft);
    padding: 1px 3px;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .block-note-display.empty {
    color: var(--text-faint);
    font-style: italic;
  }
  .search-location {
    padding: 3px 7px 5px;
    font-size: 10px;
    color: var(--text-faint);
    font-family: var(--font-mono);
    border-top: var(--hairline) solid var(--border);
    background: var(--surface-muted);
    cursor: pointer;
    user-select: none;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: color var(--transition), background var(--transition);
  }
  .search-location:hover {
    color: var(--accent);
    background: var(--surface);
  }
  .search-location.backlog {
    cursor: default;
  }
  .search-location.backlog:hover {
    color: var(--text-faint);
    background: var(--surface-muted);
  }

  /* BLOCK */
  .block {
    --block-color: var(--peacock);
    background: var(--surface);
    border: var(--hairline) solid var(--border);
    border-radius: var(--radius);
    padding: 0;
    transition: box-shadow var(--transition), transform var(--transition), opacity var(--transition);
    box-shadow: var(--shadow-sm);
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .block:hover { box-shadow: var(--shadow-md); }
  .block.dragging { opacity: 0.4; cursor: grabbing; }
  .block.done {
    opacity: 0.55;
    filter: saturate(0.3);
  }
  .block.done .block-name {
    text-decoration: line-through;
    text-decoration-thickness: 1px;
  }
  .block.stale::after {
    content: '';
    position: absolute;
    top: 6px;
    right: 6px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--alert);
    box-shadow: 0 0 0 1.5px #FFFFFF;
    z-index: 1;
  }

  .block-header {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--block-color);
    color: #FFFFFF;
    padding: 3px 7px;
    min-height: 20px;
  }

  .block-key {
    font-family: var(--font-mono);
    font-size: 12px;
    color: #FFFFFF;
    font-weight: 700;
    letter-spacing: -0.01em;
    flex-shrink: 0;
    white-space: nowrap;
    text-transform: uppercase;
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.15);
    cursor: grab;
    user-select: none;
    padding: 1px 3px;
    margin: -1px -3px -1px 0;
    border-radius: 3px;
    transition: background var(--transition);
  }
  .block-key:hover {
    background: rgba(255, 255, 255, 0.18);
  }
  .block-key:active { cursor: grabbing; }
  .block.dragging .block-key { cursor: grabbing; }
  /* Search results don't drag */
  .block.search-result .block-key {
    cursor: default;
    user-select: text;
  }
  .block.search-result .block-key:hover { background: transparent; }

  .block-name {
    font-family: var(--font-sans);
    font-size: 12px;
    background: transparent;
    border: var(--hairline) solid transparent;
    color: #FFFFFF;
    padding: 1px 3px;
    border-radius: 3px;
    flex: 1;
    min-width: 0;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .block-name::placeholder { color: rgba(255, 255, 255, 0.55); font-style: italic; font-weight: 400; }
  .block-name:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.2);
  }
  .block-name:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.96);
    color: var(--block-color);
    border-color: rgba(255, 255, 255, 0.96);
    text-overflow: clip;
  }
  .block-name:focus::placeholder { color: rgba(0, 0, 0, 0.4); }

  .block-body {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 4px;
    padding: 3px 7px 4px;
  }

  .block-hours {
    font-family: var(--font-mono);
    font-size: 11px;
    background: transparent;
    border: var(--hairline) solid transparent;
    color: var(--text);
    width: 42px;
    padding: 1px 4px;
    border-radius: 3px;
    text-align: right;
    font-weight: 700;
    flex-shrink: 0;
  }
  .block-hours:hover {
    border-color: var(--border);
    background: var(--surface-muted);
  }
  .block-hours:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface-muted);
  }

  .block-dash {
    color: var(--text-faint);
    font-size: 11px;
    flex-shrink: 0;
    user-select: none;
  }

  .block-note {
    font-family: var(--font-sans);
    font-size: 11px;
    background: transparent;
    border: var(--hairline) solid transparent;
    color: var(--text-soft);
    padding: 1px 3px;
    border-radius: 3px;
    flex: 1;
    min-width: 0;
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden;
  }
  .block-note::placeholder { color: var(--text-faint); font-style: italic; }
  .block-note:hover {
    border-color: var(--border);
    background: var(--surface-muted);
  }
  .block-note:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface-muted);
    color: var(--text);
    text-overflow: clip;
  }

  /* MODAL */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(14, 26, 36, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    backdrop-filter: blur(2px);
  }
  .modal-backdrop.hidden { display: none; }

  .modal {
    --modal-color: var(--peacock);
    background: var(--surface);
    border-radius: 8px;
    width: 440px;
    max-width: 92vw;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    border: var(--hairline) solid var(--border-strong);
  }
  .modal-stripe {
    height: 6px;
    background: var(--modal-color);
    flex-shrink: 0;
  }
  .modal-head {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-bottom: var(--hairline) solid var(--border);
    background: var(--surface);
  }
  .modal-head h3 {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-soft);
    flex: 1;
  }
  .modal-close {
    background: transparent;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 20px;
    padding: 0 8px;
    line-height: 1;
    border-radius: 4px;
  }
  .modal-close:hover { color: var(--text); background: var(--surface-muted); }

  .modal-body {
    padding: 14px 16px 4px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }
  .modal-body label {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .modal-body label > span:first-child {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-soft);
    font-weight: 700;
  }
  .modal-body input[type="text"] {
    background: var(--surface-muted);
    border: var(--hairline) solid var(--border);
    border-radius: var(--radius);
    padding: 7px 10px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
  }
  .modal-body input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
  }
  .modal-body input#editKey,
  .modal-body input#editHours {
    font-family: var(--font-mono);
    font-weight: 600;
  }
  .modal-check {
    flex-direction: row !important;
    align-items: center;
    gap: 8px !important;
    margin-top: 4px;
    padding: 6px 0;
  }
  .modal-check input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    margin: 0;
  }
  .modal-check span {
    font-size: 12px !important;
    text-transform: none !important;
    letter-spacing: 0 !important;
    color: var(--text) !important;
    font-weight: 500 !important;
  }

  .modal-foot {
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    border-top: var(--hairline) solid var(--border);
    background: var(--surface-muted);
  }
  .modal-foot-spacer { flex: 1; }
  .modal-danger {
    color: var(--alert);
    border-color: var(--border);
  }
  .modal-danger:hover {
    background: var(--alert);
    color: #FFFFFF;
    border-color: var(--alert);
  }

  /* CONTEXT MENU */
  .context-menu {
    position: fixed;
    background: var(--surface);
    border: var(--hairline) solid var(--border-strong);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    z-index: 1000;
    min-width: 140px;
  }
  .context-menu.hidden { display: none; }
  .context-menu button {
    text-align: left;
    border: none;
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 3px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-family: var(--font-sans);
  }
  .context-menu button:hover {
    background: var(--surface-muted);
  }
  .context-menu button[data-action="delete"] {
    color: var(--alert);
  }
  .context-menu button[data-action="delete"]:hover {
    background: var(--alert);
    color: #FFFFFF;
  }

  /* NAG */
  .nag {
    position: fixed;
    bottom: var(--pad-2);
    right: var(--pad-2);
    background: var(--surface);
    border: var(--hairline) solid var(--border);
    border-radius: var(--radius);
    padding: 6px 10px;
    font-size: 10px;
    color: var(--text-soft);
    box-shadow: var(--shadow-md);
    font-family: var(--font-mono);
    z-index: 100;
    display: none;
  }
  .nag.show { display: block; }
  .nag.warn { color: var(--alert); border-color: var(--alert); }

  /* SCROLLBARS */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  /* HIDDEN INPUTS */
  .hidden { display: none !important; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: var(--pad-3);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--peacock);
    color: var(--ice);
    padding: 8px 16px;
    border-radius: var(--radius);
    font-size: 12px;
    box-shadow: var(--shadow-md);
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms, transform 200ms;
    z-index: 200;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
  <header>
    <div class="brand">Planner</div>
    <div class="toolbar">
      <button id="btnToday">Today</button>
      <button id="btnPrev" title="Previous week">←</button>
      <span class="range-label" id="rangeLabel"></span>
      <button id="btnNext" title="Next week">→</button>
      <span class="spacer"></span>
      <button id="btnAddBlock" title="Add a blank block to backlog">+ Block</button>
      <input type="file" id="csvInput" accept=".csv" class="hidden">
      <button id="btnImportCsv" title="Import Jira CSV">Import CSV</button>
      <button id="btnExport" title="Export JSON backup">Export</button>
      <input type="file" id="jsonInput" accept=".json" class="hidden">
      <button id="btnImportJson" title="Restore from JSON backup">Restore</button>
      <button id="btnLink" title="Auto-save to a JSON file on disk (Chrome/Edge)">Link File…</button>
      <button id="btnTheme" title="Toggle theme">Dark</button>
    </div>
  </header>

  <main>
    <section class="weeks" id="weeks"></section>
    <aside class="backlog">
      <div class="backlog-head">
        <div class="tabs">
          <button class="tab active" data-tab="backlog">
            Backlog
            <span class="tab-count" id="backlogCount">0</span>
          </button>
          <button class="tab" data-tab="search">
            Search
          </button>
        </div>
      </div>
      <div class="tab-panel active" data-tab-panel="backlog">
        <div class="backlog-list" id="backlogList" data-drop-target="backlog"></div>
      </div>
      <div class="tab-panel" data-tab-panel="search">
        <div class="search-bar">
          <input type="search" id="searchInput" placeholder="Search ticket # or name…" spellcheck="false">
          <button class="search-clear" id="searchClear" title="Clear">×</button>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>
    </aside>
  </main>

  <div class="nag" id="nag"></div>
  <div class="toast" id="toast"></div>
  <div class="context-menu hidden" id="contextMenu">
    <button data-action="edit">Edit…</button>
    <button data-action="clone">Clone</button>
    <button data-action="toggle-done">Mark Done</button>
    <button data-action="delete">Delete</button>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" role="dialog" aria-labelledby="modalTitle">
      <div class="modal-stripe"></div>
      <div class="modal-head">
        <h3 id="modalTitle">Edit block</h3>
        <button class="modal-close" id="modalClose" title="Close">×</button>
      </div>
      <div class="modal-body">
        <label>
          <span>Jira Key</span>
          <input id="editKey" type="text" spellcheck="false" autocomplete="off" placeholder="PROJ-123">
        </label>
        <label>
          <span>Name</span>
          <input id="editName" type="text" spellcheck="false" placeholder="Ticket name">
        </label>
        <label>
          <span>Hours</span>
          <input id="editHours" type="text" spellcheck="false" placeholder="8h, 1.5h, 1d 4h">
        </label>
        <label>
          <span>Note</span>
          <input id="editNote" type="text" maxlength="60" spellcheck="false" placeholder="Short description">
        </label>
        <label class="modal-check">
          <input id="editDone" type="checkbox">
          <span>Mark this block as done</span>
        </label>
      </div>
      <div class="modal-foot">
        <button id="modalDelete" class="modal-danger" title="Delete this block">Delete</button>
        <div class="modal-foot-spacer"></div>
        <button id="modalCancel">Cancel</button>
        <button id="modalSave" class="primary">Save</button>
      </div>
    </div>
  </div>

<script>
'use strict';

// ============================================================================
// STATE
// ============================================================================

const STORAGE_KEY = 'planner.v1';
const DAY_CAP = 8;

const PALETTE = [
  '#194B6A', '#0080A3', '#492049', '#AC1A34',
  '#2E7090', '#5C2E5C', '#1F6680', '#8E3A50',
  '#3F8FB0', '#6E456E', '#D14B5A', '#0F3C56',
];

let state = {
  blocks: [],            // {id, jiraKey, name, hours, note, done, date, order, stale}
  knownKeys: [],         // keys present in last CSV import
  weekOffset: 0,         // weeks offset from current week
  theme: 'light',
  lastExport: null,
  seeded: false,         // first-run demo data flag
};

const SEED_BLOCKS = [
  { jiraKey: 'AUTH-201',  name: 'Authentication overhaul',     hours: 32 },
  { jiraKey: 'WEB-145',   name: 'Marketing site redesign',     hours: 24 },
  { jiraKey: 'API-77',    name: 'Rate limiting service',       hours: 36 },
  { jiraKey: 'DATA-312',  name: 'ETL pipeline migration',      hours: 28 },
  { jiraKey: 'INFRA-58',  name: 'Kubernetes cluster upgrade',  hours: 40 },
];

// ============================================================================
// PERSISTENCE
// ============================================================================

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('save failed', e);
    toast('Save failed: storage full?', true);
  }
  scheduleLinkedFileWrite();
  // Refresh search panel since it's read-only spans (no focus to disturb).
  // Calendar/backlog DOM aren't re-rendered so input focus is preserved.
  if (activeTab === 'search') renderSearch();
  updateNag();
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  } catch (e) {
    console.error('load failed', e);
  }
  // Migrate away the deprecated `subname` field
  for (const b of state.blocks) {
    if ('subname' in b) delete b.subname;
  }
  document.documentElement.dataset.theme = state.theme;
  document.getElementById('btnTheme').textContent = state.theme === 'light' ? 'Dark' : 'Light';
}

function seedIfFresh() {
  if (state.seeded) return;
  const t0 = Date.now();
  let i = 0;
  for (const s of SEED_BLOCKS) {
    state.blocks.push({
      id: uid(),
      jiraKey: s.jiraKey,
      name: s.name,
      hours: s.hours,
      note: '',
      done: false,
      date: null,
      stale: false,
      order: t0 + i++,
    });
  }
  state.seeded = true;
  save();
}

// ============================================================================
// UTILITIES
// ============================================================================

function uid() {
  return 'b_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

function parseHours(str) {
  if (str === null || str === undefined) return 0;
  const s = String(str).trim().toLowerCase().replace(/\s+/g, '');
  if (!s) return 0;
  // "1d 4h" / "1d4h"
  let total = 0;
  const dayMatch = s.match(/(\d+(?:\.\d+)?)d/);
  if (dayMatch) total += parseFloat(dayMatch[1]) * 8;
  const hourMatch = s.match(/(\d+(?:\.\d+)?)h/);
  if (hourMatch) total += parseFloat(hourMatch[1]);
  if (total > 0) return total;
  // bare number
  const n = parseFloat(s);
  if (!isNaN(n)) {
    // if it's clearly seconds (Jira often exports in seconds), convert
    if (n > 1000) return n / 3600;
    return n;
  }
  return 0;
}

function formatHours(h) {
  if (!h) return '0h';
  const rounded = Math.round(h * 10) / 10;
  return rounded + 'h';
}

function dateKey(d) {
  // YYYY-MM-DD using local time
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function todayKey() { return dateKey(new Date()); }

function startOfWeek(d) {
  // Monday-start week
  const out = new Date(d);
  const day = out.getDay(); // 0=Sun..6=Sat
  const diff = (day === 0 ? -6 : 1 - day);
  out.setDate(out.getDate() + diff);
  out.setHours(0, 0, 0, 0);
  return out;
}

function addDays(d, n) {
  const out = new Date(d);
  out.setDate(out.getDate() + n);
  return out;
}

function visibleWeekStarts() {
  const base = startOfWeek(new Date());
  const start = addDays(base, state.weekOffset * 7);
  return [start, addDays(start, 7)];
}

function hashKey(key) {
  if (!key) return 0;
  let h = 0;
  for (let i = 0; i < key.length; i++) {
    h = ((h << 5) - h) + key.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

function colorForKey(key) {
  if (!key) return PALETTE[0];
  return PALETTE[hashKey(key) % PALETTE.length];
}

function dayHours(date) {
  return state.blocks
    .filter(b => b.date === date)
    .reduce((sum, b) => sum + (parseFloat(b.hours) || 0), 0);
}

function toast(msg, warn) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = warn ? 'var(--alert)' : '';
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

// ============================================================================
// RENDERING
// ============================================================================

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function render() {
  renderRange();
  renderWeeks();
  renderBacklog();
  renderSearch();
  updateNag();
}

function renderRange() {
  const [first] = visibleWeekStarts();
  const last = addDays(first, 13);
  const sameYear = first.getFullYear() === last.getFullYear();
  const fmt = (d, withYear) =>
    `${MONTHS[d.getMonth()]} ${d.getDate()}${withYear ? ', ' + d.getFullYear() : ''}`;
  document.getElementById('rangeLabel').textContent =
    `${fmt(first, !sameYear)} – ${fmt(last, true)}`;
}

function renderWeeks() {
  const container = document.getElementById('weeks');
  container.innerHTML = '';
  const today = todayKey();
  const weekStarts = visibleWeekStarts();
  for (const ws of weekStarts) {
    const week = document.createElement('div');
    week.className = 'week';
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i);
      const key = dateKey(d);
      const isToday = key === today;
      const isWeekend = i >= 5;
      const dayBlocks = state.blocks
        .filter(b => b.date === key)
        .sort((a, b) => (a.order || 0) - (b.order || 0));
      const hours = dayHours(key);
      const overflow = hours > DAY_CAP;

      const dayEl = document.createElement('div');
      dayEl.className = 'day';
      if (isToday) dayEl.classList.add('today');
      if (isWeekend) dayEl.classList.add('weekend');
      if (overflow) dayEl.classList.add('overflow');
      dayEl.dataset.dropTarget = key;

      dayEl.innerHTML = `
        <div class="day-head">
          <span class="day-name">${DAYS[i]}</span>
          <span class="day-date mono">${MONTHS[d.getMonth()]} ${d.getDate()}</span>
          <span class="day-hours">${formatHours(hours)}/${DAY_CAP}h</span>
        </div>
        <div class="day-blocks" data-drop-target="${key}"></div>
      `;
      const blockList = dayEl.querySelector('.day-blocks');
      for (const b of dayBlocks) blockList.appendChild(renderBlock(b));
      attachDropHandlers(dayEl, key);
      attachDropHandlers(blockList, key);
      week.appendChild(dayEl);
    }
    container.appendChild(week);
  }
}

function renderBacklog() {
  const list = document.getElementById('backlogList');
  list.innerHTML = '';
  const items = state.blocks
    .filter(b => !b.date)
    .sort((a, b) => (a.order || 0) - (b.order || 0));
  document.getElementById('backlogCount').textContent = items.length;
  if (items.length === 0) {
    list.innerHTML = `<div class="backlog-empty">Drop blocks here, or import a Jira CSV to populate.</div>`;
  } else {
    for (const b of items) list.appendChild(renderBlock(b));
  }
  attachDropHandlers(list, null);
}

function renderSearch() {
  const list = document.getElementById('searchResults');
  if (!list) return;
  list.innerHTML = '';
  const q = (searchQuery || '').trim().toLowerCase();
  if (!q) {
    list.innerHTML = `<div class="search-empty">Start typing to find any ticket — by key or name.</div>`;
    return;
  }
  const matches = state.blocks.filter(b => {
    return (b.jiraKey || '').toLowerCase().includes(q) ||
           (b.name || '').toLowerCase().includes(q);
  });
  if (matches.length === 0) {
    list.innerHTML = `<div class="search-empty">No matches for "${escapeHtml(searchQuery)}".</div>`;
    return;
  }
  const countEl = document.createElement('div');
  countEl.className = 'search-count';
  countEl.textContent = `${matches.length} match${matches.length === 1 ? '' : 'es'}`;
  list.appendChild(countEl);
  for (const b of matches) list.appendChild(renderSearchResult(b));
}

function renderSearchResult(b) {
  const el = document.createElement('div');
  el.className = 'block search-result';
  if (b.done) el.classList.add('done');
  if (b.stale) el.classList.add('stale');
  el.dataset.id = b.id;
  el.style.setProperty('--block-color', colorForKey(b.jiraKey));

  const nameEmpty = !b.name;
  const noteEmpty = !b.note;
  const locLabel = b.date ? formatDateShort(b.date) : 'in backlog';
  const locClass = b.date ? '' : 'backlog';

  el.innerHTML = `
    <div class="block-header">
      <span class="block-key mono">${escapeHtml(b.jiraKey || '—')}</span>
      <span class="block-name-display ${nameEmpty ? 'empty' : ''}">${escapeHtml(b.name || '(no name)')}</span>
    </div>
    <div class="block-body">
      <span class="block-hours-display mono">${escapeHtml(formatHours(b.hours))}</span>
      <span class="block-dash">—</span>
      <span class="block-note-display ${noteEmpty ? 'empty' : ''}">${escapeHtml(b.note || '(no note)')}</span>
    </div>
    <div class="search-location ${locClass}" title="${b.date ? 'Click to jump to this day' : ''}">${escapeHtml(locLabel)}</div>
  `;

  el.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    e.stopPropagation();
    showContextMenu(b.id, e.clientX, e.clientY);
  });

  el.addEventListener('dblclick', (e) => {
    if (e.target.classList.contains('search-location')) return;
    e.preventDefault();
    openEditor(b.id);
  });

  if (b.date) {
    el.querySelector('.search-location').addEventListener('click', (e) => {
      e.stopPropagation();
      jumpToDate(b.date);
    });
  }

  return el;
}

function formatDateShort(dateStr) {
  const d = new Date(dateStr + 'T00:00');
  return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function jumpToDate(dateStr) {
  const target = new Date(dateStr + 'T00:00');
  const baseWeek = startOfWeek(new Date());
  const targetWeek = startOfWeek(target);
  const N = Math.round((targetWeek - baseWeek) / (7 * 86400 * 1000));
  state.weekOffset = Math.floor(N / 2) * 2;
  setActiveTab('backlog');
  save();
  render();
}

function setActiveTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.toggle('active', p.dataset.tabPanel === tab);
  });
  if (tab === 'search') {
    const inp = document.getElementById('searchInput');
    if (inp) setTimeout(() => inp.focus(), 0);
  }
}

function renderBlock(b) {
  const el = document.createElement('div');
  el.className = 'block';
  if (b.done) el.classList.add('done');
  if (b.stale) el.classList.add('stale');
  el.dataset.id = b.id;
  el.style.setProperty('--block-color', colorForKey(b.jiraKey));

  el.innerHTML = `
    <div class="block-header">
      <span class="block-key mono" title="Drag to move">${escapeHtml(b.jiraKey || '—')}</span>
      <input class="block-name" value="${escapeAttr(b.name || '')}" placeholder="ticket name" spellcheck="false">
    </div>
    <div class="block-body">
      <input class="block-hours mono" value="${formatHours(b.hours)}" title="Hours" spellcheck="false">
      <span class="block-dash">—</span>
      <input class="block-note" value="${escapeAttr(b.note || '')}" placeholder="short descriptive words" spellcheck="false" maxlength="60">
    </div>
  `;

  // Inline edit handlers
  el.querySelector('.block-hours').addEventListener('change', (e) => {
    b.hours = parseHours(e.target.value);
    e.target.value = formatHours(b.hours);
    save();
    refreshDayHours(b.date);
  });
  el.querySelector('.block-hours').addEventListener('blur', (e) => {
    e.target.value = formatHours(b.hours);
  });
  el.querySelector('.block-name').addEventListener('input', (e) => {
    b.name = e.target.value;
    save();
  });
  el.querySelector('.block-note').addEventListener('input', (e) => {
    b.note = e.target.value;
    save();
  });

  // Right-click → context menu (skip if user is in an input — show native menu instead)
  el.addEventListener('contextmenu', (e) => {
    if (e.target.matches('input, textarea')) return;
    e.preventDefault();
    e.stopPropagation();
    showContextMenu(b.id, e.clientX, e.clientY);
  });

  // Double-click block (but not on inputs) opens the modal editor
  el.addEventListener('dblclick', (e) => {
    if (e.target.matches('input, textarea')) return;
    e.preventDefault();
    openEditor(b.id);
  });

  // Drag handle: only the ticket key initiates a drag. The rest of the block
  // stays interactive (inputs are clickable/focusable without dragging).
  const keyEl = el.querySelector('.block-key');
  keyEl.draggable = true;
  keyEl.addEventListener('dragstart', (e) => {
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', b.id);
    try { e.dataTransfer.setDragImage(el, 20, 10); } catch (_) {}
  });
  keyEl.addEventListener('dragend', () => {
    el.classList.remove('dragging');
  });

  return el;
}

function refreshDayHours(date) {
  // Lightweight update of the day's hour display + overflow state
  if (!date) return;
  const dayBlocks = document.querySelector(`.day-blocks[data-drop-target="${date}"]`);
  if (!dayBlocks) return;
  const dayEl = dayBlocks.closest('.day');
  const hoursEl = dayEl.querySelector('.day-hours');
  const h = dayHours(date);
  hoursEl.textContent = `${formatHours(h)}/${DAY_CAP}h`;
  dayEl.classList.toggle('overflow', h > DAY_CAP);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) {
  return escapeHtml(s);
}

// ============================================================================
// DRAG AND DROP
// ============================================================================

function attachDropHandlers(el, dateOrNull) {
  el.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    el.classList.add('drag-over');
    if (el.classList.contains('day-blocks')) {
      el.closest('.day').classList.add('drag-over');
    }
  });
  el.addEventListener('dragleave', (e) => {
    if (e.target !== el) return;
    el.classList.remove('drag-over');
    if (el.classList.contains('day-blocks')) {
      el.closest('.day').classList.remove('drag-over');
    }
  });
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    e.stopPropagation();
    el.classList.remove('drag-over');
    if (el.classList.contains('day-blocks')) {
      el.closest('.day').classList.remove('drag-over');
    }
    const id = e.dataTransfer.getData('text/plain');
    if (!id) return;
    moveBlock(id, dateOrNull);
  });
}

function moveBlock(id, date) {
  const b = state.blocks.find(x => x.id === id);
  if (!b) return;
  if (b.date === date) return;
  b.date = date;
  b.order = Date.now();
  save();
  render();
}

// ============================================================================
// BLOCK ACTIONS
// ============================================================================

function addBlock(date) {
  const b = {
    id: uid(),
    jiraKey: '',
    name: '',
    hours: 4,
    note: '',
    done: false,
    date: date || null,
    order: Date.now(),
  };
  state.blocks.push(b);
  save();
  render();
}

function cloneBlock(id) {
  const orig = state.blocks.find(b => b.id === id);
  if (!orig) return;
  const copy = Object.assign({}, orig, {
    id: uid(),
    done: false,
    order: Date.now(),
  });
  // Insert right after original in state.blocks (visual position is dictated by `order`)
  const idx = state.blocks.indexOf(orig);
  state.blocks.splice(idx + 1, 0, copy);
  save();
  render();
}

function deleteBlock(id) {
  state.blocks = state.blocks.filter(b => b.id !== id);
  save();
  render();
}

function toggleDone(id) {
  const b = state.blocks.find(x => x.id === id);
  if (!b) return;
  b.done = !b.done;
  save();
  render();
}

// ============================================================================
// CONTEXT MENU
// ============================================================================

let ctxBlockId = null;
let activeTab = 'backlog';
let searchQuery = '';
let editingBlockId = null;

function showContextMenu(blockId, x, y) {
  const menu = document.getElementById('contextMenu');
  ctxBlockId = blockId;
  const block = state.blocks.find(b => b.id === blockId);
  if (!block) return;
  menu.querySelector('[data-action="toggle-done"]').textContent =
    block.done ? 'Mark Undone' : 'Mark Done';
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.classList.remove('hidden');
  // Adjust if it spills off-screen
  const rect = menu.getBoundingClientRect();
  if (rect.right > window.innerWidth - 8) {
    menu.style.left = (window.innerWidth - rect.width - 8) + 'px';
  }
  if (rect.bottom > window.innerHeight - 8) {
    menu.style.top = (window.innerHeight - rect.height - 8) + 'px';
  }
}

function hideContextMenu() {
  document.getElementById('contextMenu').classList.add('hidden');
  ctxBlockId = null;
}

// ============================================================================
// EDIT MODAL
// ============================================================================

function openEditor(blockId) {
  const b = state.blocks.find(x => x.id === blockId);
  if (!b) return;
  editingBlockId = blockId;
  document.getElementById('editKey').value = b.jiraKey || '';
  document.getElementById('editName').value = b.name || '';
  document.getElementById('editHours').value = formatHours(b.hours);
  document.getElementById('editNote').value = b.note || '';
  document.getElementById('editDone').checked = !!b.done;
  const modalEl = document.querySelector('.modal');
  modalEl.style.setProperty('--modal-color', colorForKey(b.jiraKey));
  document.getElementById('modalBackdrop').classList.remove('hidden');
  setTimeout(() => {
    const nameInput = document.getElementById('editName');
    nameInput.focus();
    nameInput.select();
  }, 0);
}

function closeEditor() {
  document.getElementById('modalBackdrop').classList.add('hidden');
  editingBlockId = null;
}

function saveEditor() {
  if (!editingBlockId) return;
  const b = state.blocks.find(x => x.id === editingBlockId);
  if (!b) return;
  b.jiraKey = document.getElementById('editKey').value.trim();
  b.name = document.getElementById('editName').value.trim();
  b.hours = parseHours(document.getElementById('editHours').value);
  b.note = document.getElementById('editNote').value.trim();
  b.done = document.getElementById('editDone').checked;
  save();
  render();
  closeEditor();
}

function isModalOpen() {
  return !document.getElementById('modalBackdrop').classList.contains('hidden');
}

// ============================================================================
// CSV IMPORT
// ============================================================================

function parseCSV(text) {
  // Handles quoted fields with commas, doubled-quote escapes, CRLF.
  const rows = [];
  let row = [];
  let cell = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; }
        else inQuotes = false;
      } else {
        cell += c;
      }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (c === '\r') { /* skip */ }
      else cell += c;
    }
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.length && r.some(v => v && v.length));
}

function detectColumns(headers) {
  const lc = headers.map(h => h.toLowerCase().trim());
  const find = (...patterns) => {
    for (const p of patterns) {
      const idx = lc.findIndex(h => h === p);
      if (idx >= 0) return idx;
    }
    for (const p of patterns) {
      const idx = lc.findIndex(h => h.includes(p));
      if (idx >= 0) return idx;
    }
    return -1;
  };
  return {
    key: find('issue key', 'key', 'issue id'),
    summary: find('summary', 'title', 'name'),
    estimate: find('original estimate', 'remaining estimate', 'estimate', 'time estimate', 'σ original estimate'),
  };
}

function importCsv(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('CSV looks empty', true); return; }
  const headers = rows[0];
  const cols = detectColumns(headers);
  if (cols.key < 0) {
    toast('No "Key" column found in CSV', true);
    return;
  }

  const importedKeys = [];
  let added = 0, updated = 0;

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const key = (r[cols.key] || '').trim();
    if (!key) continue;
    importedKeys.push(key);

    const summary = cols.summary >= 0 ? (r[cols.summary] || '').trim() : '';
    const estRaw = cols.estimate >= 0 ? (r[cols.estimate] || '').trim() : '';
    const hours = parseHours(estRaw) || 8;

    // Already have any block with this key? Don't duplicate-import; just clear stale flag.
    const existing = state.blocks.filter(b => b.jiraKey === key);
    if (existing.length) {
      existing.forEach(b => { b.stale = false; });
      updated++;
    } else {
      state.blocks.push({
        id: uid(),
        jiraKey: key,
        name: summary,
        hours: hours,
        note: '',
        done: false,
        date: null,
        stale: false,
        order: Date.now() + added,
      });
      added++;
    }
  }

  // Mark stale: blocks whose key isn't in this fresh import
  const keySet = new Set(importedKeys);
  for (const b of state.blocks) {
    if (b.jiraKey && !keySet.has(b.jiraKey)) b.stale = true;
  }

  state.knownKeys = importedKeys;
  save();
  render();
  toast(`Imported: ${added} new, ${updated} matched`);
}

// ============================================================================
// JSON BACKUP
// ============================================================================

function exportJson() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `planner-${todayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  state.lastExport = Date.now();
  save();
  toast('Exported');
}

function importJson(text) {
  try {
    const parsed = JSON.parse(text);
    if (!parsed || !Array.isArray(parsed.blocks)) {
      toast('Invalid backup file', true);
      return;
    }
    if (!confirm(`Restore from backup? This replaces ${state.blocks.length} current blocks with ${parsed.blocks.length}.`)) {
      return;
    }
    state = Object.assign({
      blocks: [], knownKeys: [], weekOffset: 0, theme: state.theme, lastExport: null
    }, parsed);
    save();
    render();
    toast('Restored');
  } catch (e) {
    toast('Could not parse JSON', true);
  }
}

// ============================================================================
// LINKED FILE (File System Access API) — Chrome/Edge only
// ============================================================================

const IDB_DB = 'plannerHandles';
const IDB_STORE = 'handles';
const IDB_KEY = 'linkedFile';

let linkedFileHandle = null;
let linkedFileNeedsPerm = false;
let fileWriteTimer = null;
let fileWriteInFlight = false;

function fsaSupported() {
  return typeof window.showSaveFilePicker === 'function';
}

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_DB, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbDel(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function linkFile() {
  if (!fsaSupported()) {
    toast('File linking requires Chrome or Edge', true);
    return;
  }
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: 'planner.json',
      types: [{
        description: 'Planner JSON backup',
        accept: { 'application/json': ['.json'] },
      }],
    });
    linkedFileHandle = handle;
    linkedFileNeedsPerm = false;
    await idbSet(IDB_KEY, handle);
    updateLinkUi();
    await writeLinkedFile();
    toast(`Linked to ${handle.name}`);
  } catch (e) {
    if (e.name !== 'AbortError') {
      console.error('linkFile failed', e);
      toast('Could not link file', true);
    }
  }
}

async function unlinkFile() {
  linkedFileHandle = null;
  linkedFileNeedsPerm = false;
  await idbDel(IDB_KEY);
  updateLinkUi();
  toast('Unlinked');
}

async function restoreLinkedFile() {
  if (!fsaSupported()) {
    updateLinkUi();
    return;
  }
  try {
    const handle = await idbGet(IDB_KEY);
    if (!handle) {
      updateLinkUi();
      return;
    }
    const perm = await handle.queryPermission({ mode: 'readwrite' });
    linkedFileHandle = handle;
    linkedFileNeedsPerm = perm !== 'granted';
    updateLinkUi();
  } catch (e) {
    console.error('restoreLinkedFile failed', e);
    updateLinkUi();
  }
}

async function ensureFilePerm() {
  if (!linkedFileHandle) return false;
  let perm = await linkedFileHandle.queryPermission({ mode: 'readwrite' });
  if (perm === 'granted') {
    linkedFileNeedsPerm = false;
    return true;
  }
  // requestPermission requires a user gesture; this is safe to call only from a click handler
  perm = await linkedFileHandle.requestPermission({ mode: 'readwrite' });
  if (perm === 'granted') {
    linkedFileNeedsPerm = false;
    updateLinkUi();
    return true;
  }
  linkedFileNeedsPerm = true;
  updateLinkUi();
  return false;
}

async function writeLinkedFile() {
  if (!linkedFileHandle || fileWriteInFlight) return;
  // Don't try to request permission from a non-gesture context
  const perm = await linkedFileHandle.queryPermission({ mode: 'readwrite' });
  if (perm !== 'granted') {
    linkedFileNeedsPerm = true;
    updateLinkUi();
    return;
  }
  fileWriteInFlight = true;
  try {
    const writable = await linkedFileHandle.createWritable();
    await writable.write(JSON.stringify(state, null, 2));
    await writable.close();
    state.lastExport = Date.now();
    // No save() here — would loop. Just update the nag.
    updateNag();
  } catch (e) {
    console.error('writeLinkedFile failed', e);
  } finally {
    fileWriteInFlight = false;
  }
}

function scheduleLinkedFileWrite() {
  if (!linkedFileHandle) return;
  clearTimeout(fileWriteTimer);
  fileWriteTimer = setTimeout(() => writeLinkedFile(), 1500);
}

function updateLinkUi() {
  const btn = document.getElementById('btnLink');
  if (!btn) return;
  if (!fsaSupported()) {
    btn.textContent = 'Link File (Chrome only)';
    btn.disabled = true;
    btn.title = 'Use Chrome or Edge to enable auto-save to a file';
    btn.classList.remove('linked', 'warn');
    return;
  }
  btn.disabled = false;
  if (linkedFileHandle) {
    if (linkedFileNeedsPerm) {
      btn.textContent = `⚠ ${linkedFileHandle.name}`;
      btn.title = 'Click to re-grant permission to write to this file';
      btn.classList.add('linked', 'warn');
    } else {
      btn.textContent = `✓ ${linkedFileHandle.name}`;
      btn.title = 'Auto-saving to this file. Click to change.';
      btn.classList.add('linked');
      btn.classList.remove('warn');
    }
  } else {
    btn.textContent = 'Link File…';
    btn.title = 'Auto-save to a JSON file on disk';
    btn.classList.remove('linked', 'warn');
  }
}

async function onLinkButtonClick() {
  if (linkedFileHandle && linkedFileNeedsPerm) {
    const ok = await ensureFilePerm();
    if (ok) {
      await writeLinkedFile();
      toast(`Reconnected to ${linkedFileHandle.name}`);
    }
    return;
  }
  if (linkedFileHandle) {
    const choice = prompt(
      `Currently linked to: ${linkedFileHandle.name}\n\n` +
      `Type "change" to pick a different file, "unlink" to stop auto-saving, or leave empty to cancel.`,
      ''
    );
    if (choice === 'change') linkFile();
    else if (choice === 'unlink') unlinkFile();
    return;
  }
  linkFile();
}

function updateNag() {
  const nag = document.getElementById('nag');
  if (!state.blocks.length) { nag.classList.remove('show'); return; }
  if (!state.lastExport) {
    nag.textContent = 'never exported · back up soon';
    nag.classList.add('show', 'warn');
    return;
  }
  const days = Math.floor((Date.now() - state.lastExport) / (1000 * 60 * 60 * 24));
  if (days >= 1) {
    nag.textContent = `last export: ${days}d ago`;
    nag.classList.add('show');
    nag.classList.toggle('warn', days >= 7);
  } else {
    nag.classList.remove('show');
  }
}

// ============================================================================
// EVENT WIRING
// ============================================================================

function wire() {
  document.getElementById('btnToday').addEventListener('click', () => {
    state.weekOffset = 0;
    save();
    render();
  });
  document.getElementById('btnPrev').addEventListener('click', () => {
    state.weekOffset -= 2;
    save();
    render();
  });
  document.getElementById('btnNext').addEventListener('click', () => {
    state.weekOffset += 2;
    save();
    render();
  });

  document.getElementById('btnAddBlock').addEventListener('click', () => addBlock(null));

  document.getElementById('btnImportCsv').addEventListener('click', () => {
    document.getElementById('csvInput').click();
  });
  document.getElementById('csvInput').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => importCsv(reader.result);
    reader.readAsText(f);
    e.target.value = '';
  });

  document.getElementById('btnExport').addEventListener('click', exportJson);

  document.getElementById('btnImportJson').addEventListener('click', () => {
    document.getElementById('jsonInput').click();
  });
  document.getElementById('jsonInput').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => importJson(reader.result);
    reader.readAsText(f);
    e.target.value = '';
  });

  document.getElementById('btnLink').addEventListener('click', () => {
    onLinkButtonClick();
  });

  document.getElementById('btnTheme').addEventListener('click', () => {
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = state.theme;
    document.getElementById('btnTheme').textContent = state.theme === 'light' ? 'Dark' : 'Light';
    save();
  });

  // Tabs
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => setActiveTab(t.dataset.tab));
  });

  // Search input
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');
  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    searchClear.classList.toggle('show', !!searchQuery);
    renderSearch();
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && searchQuery) {
      searchQuery = '';
      searchInput.value = '';
      searchClear.classList.remove('show');
      renderSearch();
      e.stopPropagation();
    }
  });
  searchClear.addEventListener('click', () => {
    searchQuery = '';
    searchInput.value = '';
    searchClear.classList.remove('show');
    searchInput.focus();
    renderSearch();
  });

  // Context menu wiring
  document.getElementById('contextMenu').querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const action = btn.dataset.action;
      const id = ctxBlockId;
      hideContextMenu();
      if (!id) return;
      if (action === 'edit') openEditor(id);
      else if (action === 'clone') cloneBlock(id);
      else if (action === 'toggle-done') toggleDone(id);
      else if (action === 'delete') {
        const b = state.blocks.find(x => x.id === id);
        const label = b ? (b.name || b.jiraKey || 'block') : 'block';
        if (confirm(`Delete "${label}"?`)) deleteBlock(id);
      }
    });
  });
  document.addEventListener('click', () => hideContextMenu());
  document.addEventListener('contextmenu', (e) => {
    if (!e.target.closest('.block')) hideContextMenu();
  });
  window.addEventListener('blur', () => hideContextMenu());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hideContextMenu();
  });

  // Modal wiring
  document.getElementById('modalClose').addEventListener('click', closeEditor);
  document.getElementById('modalCancel').addEventListener('click', closeEditor);
  document.getElementById('modalSave').addEventListener('click', saveEditor);
  document.getElementById('modalDelete').addEventListener('click', () => {
    if (!editingBlockId) return;
    const b = state.blocks.find(x => x.id === editingBlockId);
    const label = b ? (b.name || b.jiraKey || 'block') : 'block';
    if (confirm(`Delete "${label}"?`)) {
      const id = editingBlockId;
      closeEditor();
      deleteBlock(id);
    }
  });
  document.getElementById('modalBackdrop').addEventListener('click', (e) => {
    if (e.target.id === 'modalBackdrop') closeEditor();
  });
  document.addEventListener('keydown', (e) => {
    if (!isModalOpen()) return;
    if (e.key === 'Escape') {
      e.stopPropagation();
      closeEditor();
    } else if (e.key === 'Enter' && e.target.matches('.modal input[type="text"]')) {
      e.preventDefault();
      saveEditor();
    }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea')) return;
    if (e.key === 'ArrowLeft' && (e.altKey || e.metaKey)) {
      state.weekOffset -= 2; save(); render();
    } else if (e.key === 'ArrowRight' && (e.altKey || e.metaKey)) {
      state.weekOffset += 2; save(); render();
    } else if (e.key === 't' && (e.altKey || e.metaKey)) {
      state.weekOffset = 0; save(); render();
    }
  });
}

// ============================================================================
// BOOT
// ============================================================================

load();
seedIfFresh();
wire();
render();
restoreLinkedFile();
</script>
